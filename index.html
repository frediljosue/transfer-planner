      h("p",null,"Outlook: choose File, Open and Export, then Import, and pick the iCalendar file."),
      h("p",{class:"mute"},"This is a copy of your deadlines from today, not a live link. Your tracker lives only on this device, so a calendar cannot read it directly. After you change dates, download the file again and import it again. Every event keeps the same ID, so most calendar apps update the old ones instead of adding duplicates. Check once to be sure."))),
    h("p",{class:"mute sm"},"For a single deadline, use Add to Google next to it in the list above.")));
  return m}

var VIEWS={overview:vOverview,universities:vUnis,scholarships:vSchol,documents:vDocs,essays:vEssays,aid:vAid,tasks:vTasks,calendar:vCalendar,profile:vProfile};
function render(){var y=window.scrollY,v=location.hash.slice(1);view=VIEWS[v]?v:"overview";
  var nav=document.getElementById("nav");nav.textContent="";nav.append(h("div",{class:"brand"},h("i"),"Transfer Planner"));
  var od=overdueCount();NAV.forEach(function(n){var svg=document.createElementNS("http://www.w3.org/2000/svg","svg");svg.setAttribute("viewBox","0 0 24 24");svg.setAttribute("aria-hidden","true");var p=document.createElementNS("http://www.w3.org/2000/svg","path");p.setAttribute("d",n[2]);svg.append(p);
    nav.append(h("a",{href:"#"+n[0],"aria-current":n[0]===view?"page":null},svg,n[1],n[0]==="tasks"&&od?h("span",{class:"badge"},od):null))});
  nav.append(h("div",{class:"saved",id:"saved"},loaded||!ref?(LOCAL_ONLY?"Saved on this device":"Saved"):"Loading…"));
  var main=document.getElementById("main");main.textContent="";armed=null;
  if(ref&&!loaded){main.append(h("p",{class:"mute"},"Loading your tracker…"))}else main.append(VIEWS[view]());
  window.scrollTo(0,y)}
window.addEventListener("hashchange",function(){window.scrollTo(0,0);render()});

/* ---------- boot ---------- */
var dl=document.getElementById("schools");SCHOOLS.forEach(function(n){dl.append(h("option",{value:n}))});
function adopt(d){var n=norm(d);if(canon(n)!==canon(S)){S=n;try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}return true}return false}
function boot(db){ref=db.doc("tracker-planner/main");var first=true;var fail=setTimeout(function(){if(!loaded){loaded=true;ref=null;render()}},6000);
  ref.onSnapshot(function(snap){clearTimeout(fail);var el=document.activeElement,typing=el&&/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)&&el.id!=="newuni";
    if(!snap.exists){if(!loaded){loaded=true;if(S.rev>0){flush()}render()}return}
    var d=clone(snap.data());if(first){first=false;loaded=true;if((+d.rev||0)>=S.rev){adopt(d)}else{flush()}render();return}
    if(dirty)return;if(adopt(d)&&!typing)render()},function(){clearTimeout(fail);if(!loaded){loaded=true;ref=null;render()}})}
render();
if(window.claude&&claude.use){claude.use("db").then(function(db){if(db)boot(db);else{loaded=true;render()}}).catch(function(){loaded=true;render()})}else loaded=true;
</script>
